<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f293d" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E05E" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="radialGlow1" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad1)" rx="16" />
  <rect width="1200" height="380" fill="url(#radialGlow1)" rx="16" />

  <!-- Subtle Geometric Grid / Arch Motif -->
  <g stroke="#D4AF37" stroke-opacity="0.08" stroke-width="1.5" fill="none">
    <circle cx="950" cy="190" r="140" />
    <circle cx="950" cy="190" r="200" />
    <circle cx="950" cy="190" r="260" />
    <line x1="650" y1="190" x2="1250" y2="190" />
    <line x1="950" y1="0" x2="950" y2="380" />
  </g>

  <!-- Classical Scales of Justice Graphic (Right Side) -->
  <g transform="translate(950, 190)" filter="url(#glow1)">
    <!-- Base & Pillar -->
    <path d="M-60 130 L60 130 L45 115 L-45 115 Z" fill="url(#goldGrad1)" />
    <rect x="-6" y="-100" width="12" height="215" rx="4" fill="url(#goldGrad1)" />
    <circle cx="0" cy="-105" r="14" fill="url(#goldGrad1)" />
    
    <!-- Cross Beam -->
    <path d="M-130 -85 C -50 -95, 50 -95, 130 -85 L130 -75 C 50 -85, -50 -85, -130 -75 Z" fill="url(#goldGrad1)" />
    <circle cx="-125" cy="-80" r="6" fill="url(#goldGrad1)" />
    <circle cx="125" cy="-80" r="6" fill="url(#goldGrad1)" />

    <!-- Left Plate & Cords -->
    <line x1="-125" y1="-75" x2="-155" y2="-10" stroke="url(#goldGrad1)" stroke-width="2" />
    <line x1="-125" y1="-75" x2="-95" y2="-10" stroke="url(#goldGrad1)" stroke-width="2" />
    <path d="M-165 -10 Q -125 25 -85 -10 Z" fill="url(#goldGrad1)" opacity="0.9" />

    <!-- Right Plate & Cords -->
    <line x1="125" y1="-75" x2="95" y2="-10" stroke="url(#goldGrad1)" stroke-width="2" />
    <line x1="125" y1="-75" x2="155" y2="-10" stroke="url(#goldGrad1)" stroke-width="2" />
    <path d="M85 -10 Q 125 25 165 -10 Z" fill="url(#goldGrad1)" opacity="0.9" />
  </g>

  <!-- Left Side Text & Accents -->
  <g transform="translate(80, 0)">
    <!-- Tag Badge -->
    <rect x="0" y="65" width="230" height="32" rx="16" fill="#D4AF37" fill-opacity="0.15" stroke="#D4AF37" stroke-width="1.2" />
    <text x="115" y="86" fill="#F6E05E" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
      MODÜL 01 • FELSEFE &amp; KURAM
    </text>

    <!-- Main Title -->
    <text x="0" y="150" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" letter-spacing="1">
      Hukuk Kuramı ve
    </text>
    <text x="0" y="200" fill="url(#goldGrad1)" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" letter-spacing="1">
      Adalet Felsefesi
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="248" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="16" font-weight="400">
      Doğal Hukuk • Pozitivizm • Saf Hukuk Kuramı • Dağıtıcı Adalet • Rawls &amp; Radbruch
    </text>

    <!-- Latin Maxim -->
    <g transform="translate(0, 290)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#D4AF37" stroke-width="2" />
      <text x="50" y="4" fill="#CBD5E1" font-family="'Playfair Display', Georgia, serif" font-size="14" font-style="italic">
        "Iustitia est constans et perpetua voluntas ius suum cuique tribuendi." — Ulpianus
      </text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="2" />
</svg>
