<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021f20" />
      <stop offset="50%" stop-color="#062e34" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Cyan & Neon Emerald Gradient -->
    <linearGradient id="cyanGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Radial Cyan Glow -->
    <radialGradient id="radialGlow3" cx="80%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad3)" rx="16" />
  <rect width="1200" height="380" fill="url(#radialGlow3)" rx="16" />

  <!-- Cyber Circuit & Neural Digital Scales Pattern (Right) -->
  <g transform="translate(940, 190)" filter="url(#glow3)">
    <!-- Circuit Lines & Nodes -->
    <g stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="2" fill="none">
      <!-- Outer Hexagon Matrix -->
      <polygon points="0,-140 121,-70 121,70 0,140 -121,70 -121,-70" stroke-width="1.5" stroke-dasharray="8 4" />
      <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50" stroke-width="1" stroke-opacity="0.25" />
      
      <!-- Connecting traces -->
      <line x1="-121" y1="0" x2="-60" y2="0" />
      <line x1="121" y1="0" x2="60" y2="0" />
      <line x1="0" y1="-140" x2="0" y2="-70" />
      <line x1="0" y1="140" x2="0" y2="70" />
    </g>

    <!-- Glowing Nodes -->
    <circle cx="-121" cy="-70" r="4" fill="#2DD4BF" />
    <circle cx="121" cy="-70" r="4" fill="#2DD4BF" />
    <circle cx="121" cy="70" r="4" fill="#2DD4BF" />
    <circle cx="-121" cy="70" r="4" fill="#2DD4BF" />
    <circle cx="0" cy="-140" r="5" fill="#38BDF8" />
    <circle cx="0" cy="140" r="5" fill="#38BDF8" />

    <!-- Digital Cyber Scales of Justice -->
    <g fill="none" stroke="url(#cyanGrad3)" stroke-width="3">
      <!-- Central Pillar -->
      <line x1="0" y1="-70" x2="0" y2="70" />
      <circle cx="0" cy="-70" r="8" fill="#2DD4BF" />
      <circle cx="0" cy="70" r="10" fill="url(#cyanGrad3)" />

      <!-- Cross Beam -->
      <line x1="-80" y1="-45" x2="80" y2="-45" stroke-width="3.5" />
      
      <!-- Hanging Cords -->
      <line x1="-80" y1="-45" x2="-100" y2="0" stroke-width="1.8" />
      <line x1="-80" y1="-45" x2="-60" y2="0" stroke-width="1.8" />
      <line x1="80" y1="-45" x2="60" y2="0" stroke-width="1.8" />
      <line x1="80" y1="-45" x2="100" y2="0" stroke-width="1.8" />

      <!-- Digital Plates -->
      <polygon points="-110,0 -50,0 -65,15 -95,15" fill="#06B6D4" fill-opacity="0.3" stroke="url(#cyanGrad3)" stroke-width="2" />
      <polygon points="50,0 110,0 95,15 65,15" fill="#06B6D4" fill-opacity="0.3" stroke="url(#cyanGrad3)" stroke-width="2" />
    </g>

    <!-- Center AI Brain / Core Icon -->
    <circle cx="0" cy="0" r="16" fill="#042F2E" stroke="#2DD4BF" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#67E8F9" />
  </g>

  <!-- Left Side Content -->
  <g transform="translate(80, 0)">
    <!-- Tag Badge -->
    <rect x="0" y="65" width="275" height="32" rx="16" fill="#0D9488" fill-opacity="0.2" stroke="#14B8A6" stroke-width="1.2" />
    <text x="137" y="86" fill="#5EEAD4" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
      MODÜL 07 • DİJİTAL ÇAĞ &amp; YAPAY ZEKÂ
    </text>

    <!-- Main Title -->
    <text x="0" y="150" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" letter-spacing="1">
      Yapay Zekâ, Veri ve
    </text>
    <text x="0" y="200" fill="url(#cyanGrad3)" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" letter-spacing="1">
      Hukukun Geleceği
    </text>

    <!-- Subtitle -->
    <text x="0" y="248" fill="#99F6E4" font-family="'Inter', sans-serif" font-size="16" font-weight="400">
      Elektronik Kişilik • AB AI Act • Algoritmik Adalet • GDPR / KVKK • Akıllı Sözleşmeler
    </text>

    <!-- Latin Maxim / Quote -->
    <g transform="translate(0, 290)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#2DD4BF" stroke-width="2" />
      <text x="50" y="4" fill="#CCFBF1" font-family="'Playfair Display', Georgia, serif" font-size="14" font-style="italic">
        "Code is Law; ancak insan onuru ve anayasal adalet kodun üstündedir." — Lawrence Lessig
      </text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="2" />
</svg>
