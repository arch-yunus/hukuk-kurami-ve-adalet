<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Crimson & Gold Gradient -->
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Blue Glow Accent -->
    <radialGradient id="radialGlow2" cx="80%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad2)" rx="16" />
  <rect width="1200" height="380" fill="url(#radialGlow2)" rx="16" />

  <!-- Neoclassical Supreme Court / Parliament Dome & Pillars Silhouette (Right) -->
  <g transform="translate(930, 200)" filter="url(#glow2)">
    <!-- Pediment & Roof -->
    <polygon points="0,-130 -160,-50 160,-50" fill="none" stroke="url(#goldGrad2)" stroke-width="4" />
    <polygon points="0,-120 -145,-55 145,-55" fill="url(#goldGrad2)" opacity="0.15" />
    
    <!-- Architrave & Frieze -->
    <rect x="-170" y="-50" width="340" height="18" fill="url(#goldGrad2)" rx="3" />
    
    <!-- Pillars (4 Corinthian Style) -->
    <!-- Pillar 1 -->
    <rect x="-140" y="-32" width="22" height="140" fill="url(#goldGrad2)" opacity="0.85" rx="3" />
    <!-- Pillar 2 -->
    <rect x="-55" y="-32" width="22" height="140" fill="url(#goldGrad2)" opacity="0.85" rx="3" />
    <!-- Pillar 3 -->
    <rect x="33" y="-32" width="22" height="140" fill="url(#goldGrad2)" opacity="0.85" rx="3" />
    <!-- Pillar 4 -->
    <rect x="118" y="-32" width="22" height="140" fill="url(#goldGrad2)" opacity="0.85" rx="3" />

    <!-- Base / Podium Steps -->
    <rect x="-180" y="108" width="360" height="14" fill="url(#goldGrad2)" rx="2" />
    <rect x="-200" y="122" width="400" height="16" fill="url(#goldGrad2)" rx="3" />

    <!-- Center Emblem / Separation of Powers Symbol -->
    <circle cx="0" cy="-80" r="18" fill="none" stroke="url(#goldGrad2)" stroke-width="2.5" />
    <path d="M-8 -80 L8 -80 M0 -88 L0 -72" stroke="url(#goldGrad2)" stroke-width="2.5" />
  </g>

  <!-- Left Side Content -->
  <g transform="translate(80, 0)">
    <!-- Tag Badge -->
    <rect x="0" y="65" width="255" height="32" rx="16" fill="#818CF8" fill-opacity="0.18" stroke="#818CF8" stroke-width="1.2" />
    <text x="127" y="86" fill="#A5B4FC" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
      MODÜL 02 • KAMU &amp; DEVLET DÜZENİ
    </text>

    <!-- Main Title -->
    <text x="0" y="150" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" letter-spacing="1">
      Anayasal Devlet ve
    </text>
    <text x="0" y="200" fill="url(#goldGrad2)" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" letter-spacing="1">
      Kuvvetler Ayrılığı
    </text>

    <!-- Subtitle -->
    <text x="0" y="248" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="16" font-weight="400">
      Anayasa Üstünlüğü • Yargısal Denetim • Fren &amp; Denge • İdarenin Kanuniliği • İnsan Onuru
    </text>

    <!-- Latin Maxim / Quote -->
    <g transform="translate(0, 290)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#EAB308" stroke-width="2" />
      <text x="50" y="4" fill="#E2E8F0" font-family="'Playfair Display', Georgia, serif" font-size="14" font-style="italic">
        "İktidarı sınırlandırmak için iktidarın iktidarı durdurması gerekir." — Montesquieu
      </text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#818CF8" stroke-opacity="0.3" stroke-width="2" />
</svg>
